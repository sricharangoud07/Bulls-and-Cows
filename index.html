<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulls and Cows</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>
        Bulls and Cows Game
    </h1>
    <p>Guess a <b>4</b> digit number</p>
    <p>Get a <b>Bull</b> for <b>correct digit in the right spot</b>, and a <b>Cow</b> for <b>correct digit in the wrong spot</b>.</p>
    <div class="game-wrapper">
        <div class="game-container">
            <input type="text" id="guessInput" placeholder="Enter your guess (4 digits)">
            <button id="submitGuess">Submit Guess</button>
            <button id="giveUp">Give Up</button>
            <div id="feedback"></div>
        </div>
        <div class="record-log">
                    <div class="tries-left"></div>
                    <div class="bulls-and-cows"></div>
        </div>

    </div>
    
    <script src="index.js"></script>
</body>
</html>
