<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulls🐂 & Cows🐄</title>
    <link rel="stylesheet" href="../global.css">
    <style>
        button{
            margin: 10px;
            margin-top: 50px;
            width: 400px;
            height: 100px;
            font-size : 40px;
        }
    </style>
</head>
<body>
    <h1>
        🐂Bulls & 🐄Cows
    </h1>
    <button id="game1">Untimed Game🤔</button>
    <button id="game2">Timed Game⏱️</button>
    <script>
        game1Button = document.getElementById('game1');
        game1Button.addEventListener('click', () => {
            localStorage.setItem('gameMode', 'untimed');
            window.location.href = 'gameRules.html';
        });

        game2Button = document.getElementById('game2');
        game2Button.addEventListener('click', () => {
            localStorage.setItem('gameMode', 'timed');
            window.location.href = 'gameRules.html';
        });
    </script>
</body>
</html>
