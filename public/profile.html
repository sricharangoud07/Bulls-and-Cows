<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Bulls & Cows</title>
    <link rel="stylesheet" href="global.css">
</head>

<body>

    <h1>🐂 Bulls & Cows 🐄</h1>

    <main class="profile-container">

        <div class="profile-header">
            <h2 id="welcome"></h2>
            <p class="profile-subtitle">Player Profile</p>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <span class="stat-label">LEVEL</span>
                <span class="stat-value" id="level"></span>
            </div>

            <div class="stat-card">
                <span class="stat-label">POINTS</span>
                <span class="stat-value" id="points"></span>
            </div>

            <div class="stat-card">
                <span class="stat-label">GAMES PLAYED</span>
                <span class="stat-value" id="gamesPlayed"></span>
            </div>

            <div class="stat-card">
                <span class="stat-label">GAMES WON</span>
                <span class="stat-value" id="gamesWon"></span>
            </div>

        </div>

    </main>

    <script src="profile.js"></script>

</body>
