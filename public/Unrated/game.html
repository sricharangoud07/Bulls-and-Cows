<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐂 Bulls & 🐄 Cows</title>

    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <h1>🐂 Bulls & 🐄 Cows</h1>

    <div id="loggedOut">
        <a href="../Auth/logIn.html">Login</a>
        <a href="../Auth/register.html">Register</a>
    </div>

    <div id="loggedIn">
        <a href="../profile.html" id="Profile-Name">Profile</a>
    </div>

    <main class="game-wrapper">

        <section class="game-container">

            <div class="timer">
                Timer: 01:00
            </div>

            <div class="guess-section">

                <input
                    type="text"
                    id="guessInput"
                    placeholder="Enter your guess (4 digits)"
                    maxlength="4"
                    inputmode="numeric"
                >

                <button id="submitGuess" class="submit-button">
                    Submit Guess
                </button>

                <button id="giveUp" class="give-up-button">
                    Give Up
                </button>

            </div>

            <div id="feedback"></div>

        </section>

        <aside class="record-log">

            <div class="tries-left"></div>

            <div class="bulls-and-cows"></div>

        </aside>

    </main>

    <script src="game.js"></script>

</body>
</html>
